# モデル設定。セグメンタは UI からも切り替えられる（sam3.1 / fake）
default_segmenter: sam3.1

sam31:
  source:
    repo_id: facebook/sam3.1
    revision: daa63191845a41281374e725f4c9e51c7a824460
  # null なら上の revision の重みを HF キャッシュから読む（未取得ならダウンロード）。別の場所の重みはパスで指定
  checkpoint_path: null
  max_num_objects: 16
  use_fa3: false        # RTX A1000 (Ampere) は FlashAttention 3 非対応
  score_threshold: 0.5
  # 画像エンコーダ・後処理に何フレームまとめて通すか。公式既定 16 は 8GB で OOM（#2）
  grounding_batch_size: 1
  postprocess_batch_size: 1
  bf16_backbone: true          # 画像・テキストエンコーダだけ bf16（重み 3.7GB → 2.1GB）#4
  offload_video_to_cpu: true   # デコード済みフレームを CPU メモリに置く #4

# 長い動画をチャンクに分けて推論し、重なりフレームのマスク IoU で物体 ID をつなぐ #9
# chunk_size 以下の動画は分割しない。null で無効
chunking:
  chunk_size: 200   # 1 チャンクのフレーム数（480p で Peak VRAM 約 5GB）
  overlap: 48       # 隣り合うチャンクの重なり。SAM 3.1 は新しいセッションで物体を出すまで数〜数十フレームかかるので長めに
  match_iou: 0.3    # 重なりでの IoU がこれ未満なら別物体として新しい ID を振る

# 実験の記録先として MLflow（Docker）にも送る #45。outputs/ への保存はそのまま
#   docker compose -f docker/mlflow/compose.yaml up -d で起動 → http://127.0.0.1:5000
# サーバーに届かなければ記録を飛ばして続ける。環境変数 MLFLOW_TRACKING_URI があればそちらを使う
tracking:
  mlflow_uri: http://127.0.0.1:5000   # null で無効
  log_artifacts: true                 # 重畳動画・metadata などのファイルも送る（学習した PLY は送らない）

outputs_dir: outputs
max_upload_mib: 500
