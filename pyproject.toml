[project]
name = "spatialsam-studio"
version = "0.1.0"
description = "Text-prompted video segmentation (SAM 3.1) with evaluation, toward 3DGS integration"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "imageio>=2.34",
    "imageio-ffmpeg>=0.5",
    "numpy>=1.26,<2",
    "opencv-python-headless>=4.9",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "streamlit>=1.40",
]

[dependency-groups]
dev = ["pytest>=8.0"]
# ローカルGPU推論用。既定で入る（GPU 無し環境は `uv sync --no-group gpu`）
gpu = [
    "torch==2.10.0",
    "torchvision",
    "sam3",
    "einops",
    "pycocotools",
    # sam3 の pyproject に宣言されていないが、動画推論の経路で import される #6
    "hydra-core>=1.3",
    "psutil",
    "scikit-image",
    "scipy",
    # sam3 の model_builder が pkg_resources を使うため（setuptools>=81 で削除済み）#6
    "setuptools<81",
]

[tool.uv]
default-groups = ["dev", "gpu"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
sam3 = { git = "https://github.com/facebookresearch/sam3", rev = "7f473cfd983d5eb43040ff608f66bff0d7bdcb53" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spatialsam"]

[tool.pytest.ini_options]
testpaths = ["tests"]
