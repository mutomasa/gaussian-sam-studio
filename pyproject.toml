[project]
name = "spatialsam-studio"
version = "0.1.0"
description = "Text-prompted video segmentation (SAM 3.1) with evaluation, toward 3DGS integration"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "imageio>=2.34",
    "imageio-ffmpeg>=0.5",
    "numpy>=1.26,<2",
    # 26 以降は実行時に NumPy 2 が必要（未宣言）だが、sam3 が numpy<2 を要求するため #21
    "pyarrow<26",
    "opencv-python-headless>=4.9",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "streamlit>=1.40",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    # デモ動画の録画（scripts/record_demo.py）。ブラウザはシステムの Google Chrome を使う
    "playwright==1.64.0",
]
# ローカルGPU推論用。既定で入る（GPU 無し環境は `uv sync --no-group gpu`）
gpu = [
    "torch==2.10.0",
    "torchvision",
    "sam3",
    "einops",
    "pycocotools",
    # sam3 の pyproject に宣言されていないが、動画推論の経路で import される #6
    "hydra-core>=1.3",
    "psutil",
    "scikit-image",
    "scipy",
    # sam3 の model_builder が pkg_resources を使うため（setuptools>=81 で削除済み）#6
    "setuptools<81",
    # 3DGS 描画。torch 2.10 向けの prebuilt wheel が無いため初回に CUDA カーネルを JIT ビルドする #13
    "gsplat==1.5.3",
    # システムに CUDA ツールチェーンが無くても JIT ビルドできるよう nvcc を venv に入れる。
    # cu12 系の pip wheel には nvcc 本体が無い（ptxas のみ）ため torch も cu130 にしている #13
    "nvidia-cuda-nvcc==13.0.88",
    "nvidia-cuda-cccl==13.0.85",
    # nvcc の依存は上限が無く最新（13.4）が入り、PTX のバージョンが ptxas（13.0）と食い違うので揃える
    "nvidia-nvvm==13.0.88",
    "nvidia-cuda-crt==13.0.88",
    "plyfile>=1.0",
    # 画質指標 LPIPS（BSD-2。線形層の重みは同梱、AlexNet は torchvision の ImageNet 重みを初回に取得）#16
    "lpips==0.1.4",
]

[tool.uv]
default-groups = ["dev", "gpu"]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
sam3 = { git = "https://github.com/facebookresearch/sam3", rev = "7f473cfd983d5eb43040ff608f66bff0d7bdcb53" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spatialsam"]

[tool.pytest.ini_options]
testpaths = ["tests"]
